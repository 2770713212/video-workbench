<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111218" />
    <title>CUTLAB · 爆款视频拉片拆解与节奏克隆工作台</title>
    <link rel="icon" href="./assets/icon.svg">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><i>≋</i>CUT<span>LAB</span></div>
      <b class="nav">剪辑工作台</b>
      <div class="local"><em></em> 本地工作空间</div>
    </header>
    <main>
      <section class="intro">
        <div>
          <small>VIDEO ANALYSIS STUDIO</small>
          <h1>拉片拆解与节奏克隆</h1>
        </div>
        <div class="actions">
          <button id="newProject">新建空白工程（清空缓存）</button>
          <button id="autoFx">一键为所有快切镜头匹配音效</button>
          <button id="aiCopy">复制 AI 改写提示词</button>
          <button id="aiImport">导入 AI 脚本 (JSON)</button>
          <button id="demo">▸ 加载内置测试样片</button
          ><button id="load">↑ 导入视频</button
          ><button id="export" class="primary">⇩ 导出视频</button>
        </div>
      </section>
      <div class="workspace">
        <section class="panel preview">
          <h2><i>▣</i> 合成预览 <label>PROGRAM MONITOR</label></h2>
          <div class="captionTools">
            <label>字幕风格预设<select id="captionStyle"><option value="classic-yellow">经典黄白大字风</option><option value="highlighter-bar">荧光笔涂抹风</option><option value="typewriter-pop">逐字弹出打字机风</option><option value="cinema-caption">电影感黑边风</option></select></label>
            <label>字幕垂直位置 (Y轴)<input id="captionY" type="range" min="0" max="100" value="78"></label>
          </div>
          <div class="stage">
            <span class="stageLabel">● PREVIEW</span
            ><button id="safeToggle" aria-pressed="false">安全区参考线</button>
            <div class="screenFrame"><canvas id="screen" width="1080" height="1920"></canvas><div id="guides" hidden><span class="rightGuide">互动区</span><span class="bottomGuide">底部文案区</span></div></div
            ><span class="ratio">9:16</span>
          </div>
          <div class="transport">
            <button id="play" aria-label="播放">▶</button
            ><strong id="clock">00:00.0</strong><span>/</span
            ><span id="total"></span
            ><input
              id="scrub"
              aria-label="播放位置"
              type="range"
              min="0"
              step=".01"
              value="0"
            />
          </div>
          <div class="file">
            <i>▧</i>
            <div>
              <strong id="filename">霓虹地平线 · 节奏样板</strong
              ><small id="metadata">1080 × 1920　 /　 合成画布</small>
            </div>
          </div>
        </section>
        <div class="right">
          <section class="panel timeline">
            <h2>
              <i>▥</i> 节奏时间轴 <label>RHYTHM TIMELINE</label
              ><b id="count"></b>
            </h2>
            <div class="audioBar">
              <strong>背景音乐 (BGM)</strong><button id="pickMusic">选择本地音乐</button>
              <input id="musicFile" type="file" accept="audio/*,.mp3,.wav,.m4a" hidden>
              <span id="musicName">未选择</span>
              <label>音量 <input id="musicVolume" type="range" min="0" max="100" value="50"> <output id="musicLevel">50%</output></label>
              <label><input id="musicLoop" type="checkbox" checked> 循环播放</label>
              <label><input id="originalAudio" type="checkbox" checked> 保留原视频音轨</label>
            </div>
            <div id="ruler"></div>
            <div id="blocks"></div>
            <div class="legend">
              <span>● 快切 &lt;1.5s</span><span>● 常规</span
              ><span>● 慢镜 &gt;3s</span>
            </div>
            <div class="scan">
              <span>切镜灵敏度</span
              ><input
                type="range"
                min=".1"
                max=".9"
                step=".01"
                value=".5"
                id="sense"
                aria-label="切镜灵敏度"
              /><output id="sensVal">0.50</output
              ><button id="scan">⟳ 重新扫描</button>
            </div>
          </section>
          <section class="panel editor">
            <h2>
              <i>▤</i> 分镜编辑器 <label>SHOT EDITOR</label>
              <div class="history">
                <button id="undo" aria-label="撤销">↶</button
                ><button id="redo" aria-label="重做">↷</button>
              </div>
            </h2>
            <div id="cards"></div>
            <div class="detail">
              <div class="detailHead">
                <strong id="shotTitle"></strong>
                <div>
                  <button id="split">✂ 拆分</button
                  ><button id="merge">⇄ 合并</button>
                </div>
              </div>
              <div class="fields">
                <label>节奏定位<select id="tag"></select></label
                ><label>运镜动效<select id="motion"></select></label>
              </div>
              <div class="effectRow"><label>切镜音效<select id="effect"></select></label><button id="audition">▷ 试听</button></div>
              <label class="captionLabel"
                >替换字幕 <small id="limit"></small></label
              ><textarea
                id="caption"
                rows="2"
                aria-label="替换字幕"
                placeholder="输入字幕，用 [关键词] 高亮重点"
              ></textarea>
              <label>画面来源</label>
              <div id="sources">
                <button data-src="original">▣ 原视频</button
                ><button data-src="asset">▧ 本地素材</button
                ><button data-src="dynamic">✧ 动态背景</button>
              </div>
              <select id="theme" aria-label="动态背景" hidden></select
              ><button id="replace" hidden>更换本地素材</button>
            </div>
          </section>
        </div>
      </div>
      <footer>
        <span id="status" role="status">● 工作台就绪</span
        ><progress id="progress" max="1" hidden></progress
        ><a id="download" hidden>下载视频</a>
        <div>
          <button id="jsonIn">导入 JSON</button
          ><button id="jsonOut">导出 JSON</button>
        </div>
      </footer>
    </main>
    <input id="movie" type="file" accept="video/*,.mov" hidden /><input
      id="asset"
      type="file"
      accept="image/*,video/*"
      hidden
    /><input id="json" type="file" accept=".json" hidden />
    <dialog id="topicDialog" aria-labelledby="topicTitle">
      <form id="topicForm">
        <h3 id="topicTitle">复制 AI 改写提示词</h3>
        <label for="aiTopic">新视频主题/核心卖点</label>
        <input id="aiTopic" placeholder="例如：大学生早八极简护肤" required autofocus />
        <textarea id="manualPrompt" aria-label="可手动复制的提示词" readonly hidden></textarea>
        <p class="feedback" id="copyError" role="alert"></p>
        <div class="dialogActions"><button type="button" data-close>取消</button><button class="primary">生成并复制</button></div>
      </form>
    </dialog>
    <dialog id="scriptDialog" aria-labelledby="scriptTitle">
      <form id="scriptForm">
        <h3 id="scriptTitle">导入 AI 脚本 (JSON)</h3>
        <label for="aiScript">粘贴 AI 返回的分镜脚本</label>
        <textarea id="aiScript" rows="9" aria-describedby="scriptError" placeholder='{"scenes": [...]}' autofocus></textarea>
        <p class="feedback" id="scriptError" role="alert"></p>
        <div class="dialogActions"><button type="button" data-close>取消</button><button class="primary">解析并覆盖分镜</button></div>
      </form>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
